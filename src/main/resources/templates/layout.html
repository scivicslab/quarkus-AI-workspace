<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Workspace</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        /* ── Themes ─────── */
        :root, [data-theme="dark-catppuccin"] {
            --bg-primary:   #1e1e2e;
            --bg-secondary: #313244;
            --bg-tertiary:  #45475a;
            --text-primary: #cdd6f4;
            --text-secondary: #a6adc8;
            --accent-blue:  #89b4fa;
            --accent-green: #a6e3a1;
            --accent-red:   #f38ba8;
            --accent-yellow:#f9e2af;
            --accent-mauve: #cba6f7;
            --border-color: #585b70;
            --code-bg:      #181825;
        }
        [data-theme="dark-nord"] {
            --bg-primary:   #2e3440;
            --bg-secondary: #3b4252;
            --bg-tertiary:  #434c5e;
            --text-primary: #eceff4;
            --text-secondary: #d8dee9;
            --accent-blue:  #88c0d0;
            --accent-green: #a3be8c;
            --accent-red:   #bf616a;
            --accent-yellow:#ebcb8b;
            --accent-mauve: #b48ead;
            --border-color: #4c566a;
            --code-bg:      #272c36;
        }
        [data-theme="dark-blue"] {
            --bg-primary:   #0d1b2a;
            --bg-secondary: #1b2838;
            --bg-tertiary:  #2a3a4e;
            --text-primary: #d4dce8;
            --text-secondary: #8a9bb5;
            --accent-blue:  #5ba3f5;
            --accent-green: #6ec87a;
            --accent-red:   #e06070;
            --accent-yellow:#e8c86a;
            --accent-mauve: #a78bdb;
            --border-color: #3a4e68;
            --code-bg:      #081420;
        }
        [data-theme="dark-green"] {
            --bg-primary:   #0f1e14;
            --bg-secondary: #1a2e20;
            --bg-tertiary:  #2a4030;
            --text-primary: #d0e4d4;
            --text-secondary: #88a890;
            --accent-blue:  #60a8c8;
            --accent-green: #5ec87a;
            --accent-red:   #d86060;
            --accent-yellow:#d8c060;
            --accent-mauve: #a088c8;
            --border-color: #3a5842;
            --code-bg:      #0a180f;
        }
        [data-theme="dark-red"] {
            --bg-primary:   #1e0f0f;
            --bg-secondary: #2e1a1a;
            --bg-tertiary:  #402a2a;
            --text-primary: #e4d0d0;
            --text-secondary: #a88888;
            --accent-blue:  #6898c8;
            --accent-green: #68b870;
            --accent-red:   #e06060;
            --accent-yellow:#d8b860;
            --accent-mauve: #b088c8;
            --border-color: #583a3a;
            --code-bg:      #180a0a;
        }
        [data-theme="light-clean"] {
            --bg-primary:   #ffffff;
            --bg-secondary: #f0f2f5;
            --bg-tertiary:  #e4e6eb;
            --text-primary: #1c1e21;
            --text-secondary: #606770;
            --accent-blue:  #1877f2;
            --accent-green: #31a24c;
            --accent-red:   #e41e3f;
            --accent-yellow:#f7b928;
            --accent-mauve: #8b5cf6;
            --border-color: #ced0d4;
            --code-bg:      #f6f8fa;
        }
        [data-theme="light-warm"] {
            --bg-primary:   #faf6f0;
            --bg-secondary: #f0ebe3;
            --bg-tertiary:  #e6dfd5;
            --text-primary: #3d3529;
            --text-secondary: #7a6f60;
            --accent-blue:  #4a7c96;
            --accent-green: #6a8f5e;
            --accent-red:   #c45a5a;
            --accent-yellow:#c49a3c;
            --accent-mauve: #8a6aad;
            --border-color: #d5cec4;
            --code-bg:      #ede7dd;
        }
        [data-theme="light-blue"] {
            --bg-primary:   #eef4fb;
            --bg-secondary: #dce8f5;
            --bg-tertiary:  #c8d9ed;
            --text-primary: #1a2a40;
            --text-secondary: #4a6080;
            --accent-blue:  #2b7de9;
            --accent-green: #3a9e50;
            --accent-red:   #d44050;
            --accent-yellow:#c89a30;
            --accent-mauve: #7a5ec0;
            --border-color: #b0c8e4;
            --code-bg:      #dae6f3;
        }
        [data-theme="light-green"] {
            --bg-primary:   #f0f8f0;
            --bg-secondary: #e0f0e0;
            --bg-tertiary:  #cce4cc;
            --text-primary: #1a301a;
            --text-secondary: #4a704a;
            --accent-blue:  #3080b0;
            --accent-green: #2e8b48;
            --accent-red:   #c84848;
            --accent-yellow:#b89830;
            --accent-mauve: #7858b0;
            --border-color: #a8cca8;
            --code-bg:      #dceede;
        }
        [data-theme="light-red"] {
            --bg-primary:   #fbf0f0;
            --bg-secondary: #f5dce0;
            --bg-tertiary:  #ecc8cc;
            --text-primary: #401a1e;
            --text-secondary: #804a50;
            --accent-blue:  #3880b8;
            --accent-green: #3a9850;
            --accent-red:   #d03848;
            --accent-yellow:#c09030;
            --accent-mauve: #8050b8;
            --border-color: #e0b0b8;
            --code-bg:      #f3dade;
        }

        /* ── Reset ──────────────────────────────────────────── */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, 'Noto Sans JP', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* ── Header ─────────────────────────────────────────── */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-primary);
        }
        .brand-logo { font-size: 1.3rem; }
        .brand-name {
            font-size: 18px;
            font-weight: 600;
            color: var(--accent-blue);
        }
        .brand-version {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            opacity: 0.8;
            align-self: flex-end;
            padding-bottom: 2px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        #theme-select {
            background: var(--bg-tertiary);
            color: var(--accent-green);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 3px 8px;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            outline: none;
        }
        #theme-select:hover, #theme-select:focus { border-color: var(--accent-blue); }

        /* ── Main layout ─────────────────────────────────────── */
        main { max-width: 960px; margin: 0 auto; padding: 24px 20px 60px; }

        .section-label {
            font-size: 15px;
            font-weight: 600;
            color: var(--accent-mauve);
            margin: 28px 0 12px;
        }

        /* ── Session card ────────────────────────────────────── */
        .session-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 8px;
            transition: background .15s;
        }
        .session-card:hover { background: var(--bg-tertiary); }

        .session-head {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .session-name {
            font-weight: 600;
            font-size: 14px;
            color: var(--text-primary);
            text-decoration: none;
            transition: color .15s;
        }
        .session-name:hover { color: var(--accent-blue); }

        .session-port {
            font-size: 12px;
            color: var(--text-secondary);
            font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
            background: var(--code-bg);
            padding: 1px 7px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .session-params {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 5px;
            font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
        }

        .session-log {
            font-size: 12px;
            color: var(--text-secondary);
            font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
            margin-top: 8px;
            max-height: 80px;
            overflow-y: auto;
            background: var(--code-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 6px 10px;
            line-height: 1.5;
        }

        .memo-input {
            margin-top: 8px;
            width: 100%;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 5px 10px;
            font-size: 13px;
            color: var(--text-secondary);
            background: var(--bg-primary);
            outline: none;
            font-family: inherit;
            transition: border-color .15s;
        }
        .memo-input:focus { border-color: var(--accent-blue); color: var(--text-primary); }
        .memo-input::placeholder { color: var(--text-secondary); opacity: .6; }

        /* ── Badges ──────────────────────────────────────────── */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 2px 9px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .04em;
            text-transform: uppercase;
        }
        .badge::before {
            content: '';
            width: 6px; height: 6px;
            border-radius: 50%;
            background: currentColor;
        }
        .badge-READY    { color: var(--accent-green);  background: color-mix(in srgb, var(--accent-green) 15%, transparent); }
        .badge-STARTING { color: var(--accent-yellow); background: color-mix(in srgb, var(--accent-yellow) 15%, transparent); }
        .badge-STARTING::before { animation: pulse 1.2s ease-in-out infinite; }
        .badge-FAILED   { color: var(--accent-red);    background: color-mix(in srgb, var(--accent-red) 15%, transparent); }
        .badge-STOPPED  { color: var(--text-secondary); background: color-mix(in srgb, var(--text-secondary) 15%, transparent); }

        @keyframes pulse {
            0%, 100% { opacity: .3; transform: scale(.8); }
            50%       { opacity: 1; transform: scale(1); }
        }

        /* ── Buttons ─────────────────────────────────────────── */
        .btn {
            padding: 4px 14px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            transition: opacity .15s;
        }
        .btn:hover { opacity: .85; }

        .btn-start, .btn-launch {
            background: var(--accent-blue);
            color: var(--bg-primary);
        }
        .btn-stop {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--accent-red);
            border-color: var(--accent-red);
        }
        .btn-stop:hover { background: color-mix(in srgb, var(--accent-red) 12%, transparent); opacity: 1; }
        .btn-stop:disabled { opacity: 0.5; cursor: default; }
        .session-card.stopping {
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .btn-download {
            background: none;
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            font-size: 0.75rem;
            padding: 0.2rem 0.6rem;
        }
        .btn-download:hover { background: color-mix(in srgb, var(--accent-green) 12%, transparent); opacity: 1; }
        .download-status { font-size: 0.75rem; color: var(--text-secondary); margin-left: 0.3rem; }
        .tool-status { font-size: 0.8rem; color: var(--text-secondary); margin-left: 0.4rem; }
        /* ── Tool grid ───────────────────────────────────────── */
        .tool-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 12px;
        }

        .tool-tile {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 18px;
            transition: background .15s, border-color .15s;
        }
        .tool-tile:hover {
            background: var(--bg-tertiary);
            border-color: var(--accent-blue);
        }

        .tool-tile-name {
            font-weight: 600;
            font-size: 14px;
            color: var(--text-primary);
            margin-bottom: 14px;
        }

        .param-row { margin-bottom: 10px; }
        .param-label {
            display: block;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .param-input, .param-select {
            width: 100%;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 6px 10px;
            font-size: 13px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: inherit;
            outline: none;
            transition: border-color .15s;
        }
        .param-input:focus, .param-select:focus { border-color: var(--accent-blue); }
        .param-input::placeholder { color: var(--text-secondary); opacity: .6; }
        .param-select option { background: var(--bg-secondary); }

        .dir-row { display: flex; gap: 6px; }
        .dir-row .param-input { flex: 1; min-width: 0; }
        .btn-browse {
            flex-shrink: 0;
            padding: 5px 10px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: var(--bg-tertiary);
            font-size: 12px;
            cursor: pointer;
            color: var(--text-secondary);
            font-family: inherit;
            transition: border-color .15s, color .15s;
        }
        .btn-browse:hover { border-color: var(--accent-blue); color: var(--accent-blue); }

        /* ── Directory browser modal ─────────────────────────── */
        .dir-modal-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        .dir-modal-overlay.open { display: flex; }

        .dir-modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 16px 48px rgba(0,0,0,.4);
            width: min(480px, 92vw);
            max-height: 70vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .dir-modal-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            font-size: 14px;
            color: var(--text-primary);
        }
        .dir-modal-path {
            padding: 7px 16px;
            font-size: 12px;
            font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
            color: var(--text-secondary);
            background: var(--code-bg);
            border-bottom: 1px solid var(--border-color);
            word-break: break-all;
        }
        .dir-modal-list { flex: 1; overflow-y: auto; padding: 4px 0; }
        .dir-item {
            padding: 7px 16px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            transition: background .1s, color .1s;
        }
        .dir-item:hover { background: var(--bg-tertiary); color: var(--text-primary); }
        .dir-item-up { font-style: italic; }
        .dir-modal-footer {
            padding: 10px 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        .btn-cancel {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 4px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
            transition: border-color .15s;
        }
        .btn-cancel:hover { border-color: var(--accent-blue); color: var(--text-primary); }

        /* ── Scrollbar ───────────────────────────────────────── */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--bg-tertiary); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

        /* ── Session tabs ────────────────────────────────────── */
        .tab-bar {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .tab-btn {
            padding: 4px 14px;
            border-radius: 4px 4px 0 0;
            border: 1px solid var(--border-color);
            border-bottom: none;
            background: var(--bg-secondary);
            color: var(--text-secondary);
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            transition: color .15s, background .15s;
        }
        .tab-btn:hover { color: var(--text-primary); }
        .tab-btn.active {
            background: var(--bg-tertiary);
            color: var(--accent-blue);
            font-weight: 600;
        }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        /* ── Drag handle ─────────────────────────────────────── */
        .session-card[draggable="true"] { cursor: grab; }
        .session-card.drag-over { outline: 2px solid var(--accent-blue); }
        .session-card.dragging { opacity: 0.4; }

        /* ── Session menu (⋮) ────────────────────────────────── */
        .btn-menu {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            padding: 0 4px;
            line-height: 1;
            transition: color .15s;
        }
        .btn-menu:hover { color: var(--text-primary); }
        .session-menu-popup {
            position: fixed;
            z-index: 1000;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-shadow: 0 8px 24px rgba(0,0,0,.3);
            min-width: 160px;
            overflow: hidden;
        }
        .menu-item {
            padding: 8px 16px;
            font-size: 13px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: background .1s, color .1s;
        }
        .menu-item:hover { background: var(--bg-tertiary); color: var(--text-primary); }

        /* An anchor used as a button: .btn was written for <button>, which has no underline and
           no link colour of its own. Open / Detail / Back are links because they navigate. */
        a.btn { text-decoration: none; display: inline-block; line-height: 1.5;
                border: 1px solid var(--border-color); color: var(--text-primary);
                background: none; }
        a.btn:hover { background: color-mix(in srgb, var(--text-primary) 8%, transparent); opacity: 1; }
        a.btn-open { border-color: var(--accent-green); color: var(--accent-green); }
        a.btn-open:hover { background: color-mix(in srgb, var(--accent-green) 12%, transparent); }

        /* ── Catalog tile ─────── */
        /* Top-aligned, not centred: a tool running seven instances has a status three lines tall,
           and centring put its icon beside the middle line instead of at the top-left corner. */
        .tool-head { display: flex; align-items: flex-start; gap: 0.6rem; margin-bottom: 0.6rem; }
        .tool-icon { width: 28px; height: 28px; object-fit: contain; flex: none; border-radius: 4px; }
        .tool-icon-letter { display: flex; align-items: center; justify-content: center;
                            background: var(--bg-tertiary); color: var(--text-secondary);
                            font-weight: 700; font-size: 15px; }
        /* One button per line: three buttons of different widths wrapped into a ragged block. */
        .tool-buttons { display: flex; flex-direction: column; align-items: stretch; gap: 0.35rem; }
        .tool-buttons .btn { width: 100%; text-align: center; }
        .launch-form { margin-top: 0.7rem; border-top: 1px solid var(--border-color);
                       padding-top: 0.7rem; }
        .launch-form .btn-launch { width: 100%; margin-top: 0.5rem; }

        /* ── Settings ─────── */
        .settings-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .settings-table th { text-align: left; padding: 0.45rem 0.6rem; font-weight: 600;
                             color: var(--text-secondary); border-bottom: 1px solid var(--border-color);
                             white-space: nowrap; }
        .settings-table td { padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--border-color);
                             vertical-align: top; }
        .settings-unset { color: var(--text-secondary); font-style: italic; }

        /* ── Screen navigation (Instances / Catalog) ─────── */
        .screen-nav { display: flex; gap: 0.25rem; margin-bottom: 1.25rem;
                      border-bottom: 1px solid var(--border); }
        .screen-tab { padding: 0.5rem 1rem; text-decoration: none; font-size: 14px;
                      color: var(--text-secondary); border-bottom: 2px solid transparent;
                      margin-bottom: -1px; }
        .screen-tab:hover { color: var(--text-primary); }
        .screen-tab-active { color: var(--text-primary); font-weight: 600;
                             border-bottom-color: var(--accent, #89b4fa); }

        /* ── Instances table ─────── */
        .inst-summary { font-size: 13px; color: var(--text-secondary); margin-bottom: 0.75rem; }
        .inst-summary b { color: var(--text-primary); }
        .inst-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .inst-table th { text-align: left; padding: 0.45rem 0.6rem; font-weight: 600;
                         color: var(--text-secondary); border-bottom: 1px solid var(--border);
                         white-space: nowrap; }
        .inst-table td { padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--border);
                         vertical-align: middle; }
        .inst-table tr:hover td { background: var(--bg-hover, rgba(255,255,255,0.03)); }
        .inst-name { font-weight: 600; color: var(--text-primary); }
        .inst-mono { font-family: 'Cascadia Code','Fira Code','Consolas',monospace; }
        .inst-actions { white-space: nowrap; display: flex; gap: 0.3rem; flex-wrap: wrap; }
        .inst-empty { color: var(--text-secondary); padding: 1.5rem 0; }
        .state-pill { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 10px;
                      font-size: 12px; font-weight: 600; }
        .state-READY { background: rgba(64,160,96,0.18); color: #4ec07a; }
        .state-STARTING { background: rgba(200,160,60,0.18); color: #d7b45a; }
        .state-FAILED { background: rgba(200,70,70,0.18); color: #e06060; }
        .state-STOPPED { background: rgba(128,128,128,0.18); color: var(--text-secondary); }

        .inst-activity { color: var(--text-primary); max-width: 46ch; }
        .detail-activity { font-size: 14px; margin: 0 0 1rem; }

        /* ── Instance detail ─────── */
        .detail-head { display: flex; align-items: baseline; gap: 0.75rem; flex-wrap: wrap;
                       margin-bottom: 0.5rem; }
        .detail-grid { display: grid; grid-template-columns: max-content 1fr; gap: 0.35rem 1rem;
                       font-size: 13px; margin: 0.75rem 0 1.25rem; }
        .detail-grid dt { color: var(--text-secondary); }
        .detail-grid dd { margin: 0; color: var(--text-primary); }
        .detail-log { background: var(--bg-code, rgba(0,0,0,0.25)); border: 1px solid var(--border);
                      border-radius: 6px; padding: 0.6rem 0.8rem; font-size: 12px;
                      font-family: 'Cascadia Code','Fira Code','Consolas',monospace;
                      white-space: pre-wrap; word-break: break-all; max-height: 60vh;
                      overflow-y: auto; }
    </style>
</head>
<body>

<header>
    <a href="/" class="brand">
        <span class="brand-logo">⛲</span>
        <span class="brand-name">AI Workspace</span>
        <span class="brand-version">v{version}{#if imageTag}&nbsp;·&nbsp;{imageTag}{/if}</span>
    </a>
    <div class="header-controls">
        <a href="/env-config" style="color:var(--text-secondary);text-decoration:none;">⚙ Env Config</a>
        <label>Theme:
            <select id="theme-select">
                <option value="dark-catppuccin">Dark Catppuccin</option>
                <option value="dark-nord">Dark Nord</option>
                <option value="dark-blue">Dark Blue</option>
                <option value="dark-green">Dark Green</option>
                <option value="dark-red">Dark Red</option>
                <option value="light-clean">Light Clean</option>
                <option value="light-warm">Light Warm</option>
                <option value="light-blue">Light Blue</option>
                <option value="light-green">Light Green</option>
                <option value="light-red">Light Red</option>
            </select>
        </label>
    </div>
</header>

<main>

    <nav class="screen-nav">
        <a href="/" class="screen-tab{#if screen == 'catalog'} screen-tab-active{/if}">Catalog</a>
        <a href="/instances" class="screen-tab{#if screen == 'instances'} screen-tab-active{/if}">Instances</a>
        <a href="/settings" class="screen-tab{#if screen == 'settings'} screen-tab-active{/if}">Settings</a>
    </nav>

{#insert body /}

</main>

<!-- Directory Browser Modal -->
<div class="dir-modal-overlay" id="dir-modal-overlay">
    <div class="dir-modal">
        <div class="dir-modal-header">Select Directory</div>
        <div class="dir-modal-path" id="dir-modal-path"></div>
        <div class="dir-modal-list" id="dir-modal-list"></div>
        <div class="dir-modal-footer">
            <button class="btn-cancel" onclick="closeDirBrowser()">Cancel</button>
            <button class="btn btn-launch" onclick="confirmDirBrowser()">Select</button>
        </div>
    </div>
</div>

<script>
    // Theme persistence
    (function () {
        const KEY = 'sp-theme';
        const sel = document.getElementById('theme-select');
        const saved = localStorage.getItem(KEY) || 'dark-catppuccin';
        document.documentElement.setAttribute('data-theme', saved);
        sel.value = saved;
        sel.addEventListener('change', () => {
            const t = sel.value;
            document.documentElement.setAttribute('data-theme', t);
            localStorage.setItem(KEY, t);
        });
    })();
</script>
<script>
    // A tool's icon: try its favicon.svg, then its favicon.ico, then leave the letter in place.
    function toolIconFallback(img, base) {
        if (img.dataset.triedIco) { img.remove(); return; }
        img.dataset.triedIco = '1';
        img.src = base + 'favicon.ico';
    }
</script>
<script src="static/app.js?v={assetVersion}"></script>
</body>
</html>
